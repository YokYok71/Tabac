<!-- `frame-ancestors 'none'` below is INERT and is kept
     deliberately. CSP Level 3 §3.3 requires a user agent to DROP that
     directive (with report-uri and sandbox) from a policy delivered by a
     <meta> element, so no browser has ever honoured it here; the header would
     work and GitHub Pages cannot send one. It stays because it is the correct
     directive the day this is served behind something that can, and because
     deleting it invites the next reader to "add clickjacking protection" and
     put it straight back. THE REAL DEFENCE IS src/utils/frameGuard.ts, which
     refuses to render a framed document — do not remove it believing this
     line covers you. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://accounts.google.com https://apis.google.com; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://api.dropboxapi.com https://content.dropboxapi.com https://nominatim.openstreetmap.org; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; worker-src 'self'; form-action 'self' https://accounts.google.com; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; upgrade-insecure-requests;">

<!-- `default` ET NON `black-translucent`, et ce n'est pas une préférence
     esthétique : c'est la seule chose qui puisse retirer le voile qu'iOS
     peignait sur la barre du haut.

     CE QUI A ÉTÉ OBSERVÉ. Sur un iPad passé à iOS 27, la barre du haut de
     l'app INSTALLÉE est apparue trouble — texte et icônes ternis, comme sous
     une brume. La MÊME page, le MÊME build, ouverte dans Safari sur le même
     appareil : nette. C'est cette paire de captures qui a tranché, et elle a
     tué au passage deux diagnostics défendus ici-même : la transparence du
     fond des barres (rendue opaque au build 15, sans effet) et la promotion
     de couche due au `transform` de l'escamotage (présent aussi dans Safari,
     qui est net). Une cause qui ne distingue pas standalone de navigateur ne
     peut pas expliquer une différence entre standalone et navigateur.

     POURQUOI. Avec `black-translucent`, le contenu web passe SOUS la barre
     d'état et iOS dessine la sienne par-dessus — en posant un voile pour que
     l'heure et la batterie restent lisibles quel que soit le fond. Ce voile
     tombe exactement sur la bande où vit la barre du haut. Dans Safari la
     chrome du navigateur occupe cette bande, donc rien n'est superposé. Et
     c'est aussi pourquoi AUCUN CSS de l'app ne pouvait le corriger : le voile
     est peint après toute la composition de la page.

     `default` PLUTÔT QUE `black`, qui aurait aussi réservé la bande : `black`
     la figerait en noir, alors que cette app a un MODE CLAIR. La balise
     `theme-color` est déjà tenue en phase avec le mode choisi par App.tsx
     (voir THEME_COLOR_META), et son propre commentaire la nomme « iOS status
     bar / letterbox » — `default` laisse donc cette synchronisation, déjà
     correcte, piloter la bande, là où `black` la contredirait la moitié du
     temps.

     CE QUE ÇA COÛTE, dit plutôt que découvert : l'app ne s'étend plus sous la
     barre d'état. `viewport-fit=cover` RESTE — il porte encore les côtés en
     paysage et l'indicateur d'accueil en bas. FAUX, ET MESURÉ DEPUIS : j'avais écrit ici que « l'inset
     haut retombe à 0 une fois la bande réservée, donc le plancher de 14 px
     reprend la main, sans double marge ». `env(safe-area-inset-top)` vaut
     ~59 pt sur un iPhone à îlot dynamique, réservation ou non — il mesure
     jusqu'au BAS DE L'ÎLOT, pas jusqu'au bas du texte de la barre d'état.
     Résultat mesuré sur un écran de 395 x 859 pt : les glyphes système
     s'arrêtent à 39 pt, le premier pixel du titre de l'app est à 88 pt,
     soit 50 pt d'espace libre. Le build 17 en reprend 12 via `safeTop()`
     (theme-curator.ts), qui est désormais la SEULE définition de cette marge
     — quatorze fichiers l'écrivaient à la main.

     VÉRIFIÉ DEPUIS : le voile disparaît, et la barre du haut est alors PIXEL
     POUR PIXEL identique à Safari (rgb(224,195,145), luminance 198 des deux
     côtés).

     LA RÉINSTALLATION EST REQUISE, ET J'AI ÉCRIT DEUX FOIS LE CONTRAIRE ICI.
     Mesure qui tranche, sur l'iPad de l'utilisateur : **build 20 affiché dans
     Réglages, Safari NET sur le même appareil, app installée TROUBLE, jamais
     réinstallée**. Trois faits au même instant, sur la même machine : la
     balise n'est donc PAS relue au chargement — elle est figée au moment où
     l'app est ajoutée à l'écran d'accueil. Une mise à jour ordinaire ne la
     change pas.

     CE QUI M'A FAIT ÉCRIRE L'INVERSE, parce que l'erreur est instructive : un
     SECOND iPhone montrait la barre correcte sans réinstallation, et j'en ai
     conclu « la réinstallation n'est pas requise ». Ce test reposait sur une
     hypothèse que j'avais SIGNALÉE en l'écrivant — que cet iPhone avait l'app
     installée AVANT le build 16 — et que je n'avais pas vérifiée. Une
     installation neuve reçoit `default` d'emblée et ne prouve donc rien.
     **Signaler une hypothèse ne la vérifie pas**, et écrire la conclusion
     comme établie par-dessus une hypothèse ouverte est l'erreur, pas le fait
     de l'avoir eue. Voir la RÈGLE ZÉRO de CLAUDE.md.

     CONSÉQUENCE UTILISATEUR, ET ELLE EST RÉELLE : toute installation
     antérieure au build 16 garde le voile jusqu'à ce que l'icône soit retirée
     et remise. Le changelog le dit désormais dans les six langues — avec
     « sauvegardez d'abord », parce qu'il n'est PAS établi que retirer l'icône
     préserve le stockage du site (les sources secondaires divergent, et ce
     n'est pas une chose à faire supposer à quelqu'un sur sa vraie cave).
     UNE PISTE NON PRISE, énoncée pour qu'on ne la redécouvre pas : l'app POURRAIT
     détecter ce cas et le dire. En standalone, une installation encore figée sur
     `black-translucent` garde un `env(safe-area-inset-top)` non nul là où
     `default` le met à 0 — le signal est donc mesurable depuis la page. Non
     construit, non mesuré sur appareil : c'est une hypothèse, pas un fait. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cave Tabac">
<meta name="theme-color" content="#0a0a0a">
<title>Ma Cave à Tabac</title>

<!-- MOUVEMENT RÉDUIT — la préférence système, honorée en un seul endroit.

     iOS (Réglages → Accessibilité → Mouvement) et Android (Supprimer les
     animations) exposent un réglage que le navigateur transmet ici. Les gens qui
     l'activent ne le font pas par goût : troubles vestibulaires, migraines
     déclenchées par le mouvement, mal des transports. Une animation qu'ils n'ont
     pas demandée est un symptôme.

     POURQUOI ICI ET PAS DANS LES COMPOSANTS. L'app porte 68 transitions inline,
     dont 33 comportent un mouvement. Faire passer un `usePrefersReducedMotion`
     dans chacune serait 33 endroits à ne pas oublier, aujourd'hui et à chaque
     ajout. Une règle CSS globale les couvre toutes, y compris celles qui
     n'existent pas encore — c'est la seule forme qui ne se périme pas.

     CE QU'ELLE NE CASSE PAS, vérifié : aucun code de l'app n'écoute
     `transitionend` ni `animationend`, donc rien n'attend la fin d'une animation
     pour continuer. Aucun `scroll-behavior: smooth` non plus (choix déjà
     assumé dans FilterControls), donc rien à neutraliser de ce côté.

     `0.01ms` ET NON `0` : une durée nulle empêche l'évènement de fin d'être
     émis par certains moteurs. La valeur reste imperceptible tout en gardant
     l'animation formellement existante.

     `usePrefersReducedMotion` (hooks/useChromeAutoHide.ts) SURVIT et n'est pas
     redondant : l'escamotage de la chrome lit la préférence en JavaScript pour
     poser sa variable `--chrome-ms`, ce qu'une feuille de style ne peut pas
     faire à sa place. Les deux visent le même résultat par deux chemins. -->
<style>@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important}}</style>
