<!-- `frame-ancestors 'none'` below is INERT and is kept
     deliberately. CSP Level 3 §3.3 requires a user agent to DROP that
     directive (with report-uri and sandbox) from a policy delivered by a
     <meta> element, so no browser has ever honoured it here; the header would
     work and GitHub Pages cannot send one. It stays because it is the correct
     directive the day this is served behind something that can, and because
     deleting it invites the next reader to "add clickjacking protection" and
     put it straight back. THE REAL DEFENCE IS src/utils/frameGuard.ts, which
     refuses to render a framed document — do not remove it believing this
     line covers you. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://accounts.google.com https://apis.google.com; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://api.dropboxapi.com https://content.dropboxapi.com https://nominatim.openstreetmap.org; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; worker-src 'self'; form-action 'self' https://accounts.google.com; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; upgrade-insecure-requests;">

<!-- The tab icon for EVERY OTHER browser. The line above is
     iOS-only, so Android Chrome and every desktop browser had no declared
     icon at all: they fall back to requesting /favicon.ico, which this site
     does not serve, so each got a 404 on every page load and a blank tab.
     An iOS-specific affordance with no equivalent for the other platform is
     exactly the iOS/Android parity invariant, and the browser tab is the
     first thing a visitor sees before installing anything. A PNG is fine —
     .ico has not been required since IE. -->

<!-- MOUVEMENT RÉDUIT — la préférence système, honorée en un seul endroit.

     iOS (Réglages → Accessibilité → Mouvement) et Android (Supprimer les
     animations) exposent un réglage que le navigateur transmet ici. Les gens qui
     l'activent ne le font pas par goût : troubles vestibulaires, migraines
     déclenchées par le mouvement, mal des transports. Une animation qu'ils n'ont
     pas demandée est un symptôme.

     POURQUOI ICI ET PAS DANS LES COMPOSANTS. L'app porte 68 transitions inline,
     dont 33 comportent un mouvement. Faire passer un `usePrefersReducedMotion`
     dans chacune serait 33 endroits à ne pas oublier, aujourd'hui et à chaque
     ajout. Une règle CSS globale les couvre toutes, y compris celles qui
     n'existent pas encore — c'est la seule forme qui ne se périme pas.

     CE QU'ELLE NE CASSE PAS, vérifié : aucun code de l'app n'écoute
     `transitionend` ni `animationend`, donc rien n'attend la fin d'une animation
     pour continuer. Aucun `scroll-behavior: smooth` non plus (choix déjà
     assumé dans FilterControls), donc rien à neutraliser de ce côté.

     `0.01ms` ET NON `0` : une durée nulle empêche l'évènement de fin d'être
     émis par certains moteurs. La valeur reste imperceptible tout en gardant
     l'animation formellement existante.

     `usePrefersReducedMotion` (hooks/useChromeAutoHide.ts) SURVIT et n'est pas
     redondant : l'escamotage de la chrome lit la préférence en JavaScript pour
     poser sa variable `--chrome-ms`, ce qu'une feuille de style ne peut pas
     faire à sa place. Les deux visent le même résultat par deux chemins. -->
<style>@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0.01ms !important;animation-duration:0.01ms !important}}</style>
