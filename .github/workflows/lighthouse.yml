name: Lighthouse CI

# Performance budgets enforced via Lighthouse CI. Runs after
# every push to main and every PR. Assertions live in .lighthouserc.json
# (mobile profile, throttled 4G, 3-run median). Failures block the PR
# check; warnings show in the workflow log but don't fail.
#
# The point: catch perf regressions before they reach production.
# Baseline measured on 26 Nov 2026 (dist) — DATED, it drifts; `npm run
# size:check` prints the live figure on every run:
#   - vendor-react.js : 65.8 KB gzip
#   - index.js (app)  : 172.3 KB gzip
#   - eager scripts   : 291.9 KB gzip (size:check's own total)
# Well under the 500 KB script budget, and 88% of the tighter local
# `size:check` budget (332 KB). See docs/checks.md (bundle budgets).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Fail fast on a bundle-size regression (e.g. the catalog
      # descriptions leaking back into the base chunk, as once happened) BEFORE
      # the slower 3-run Lighthouse pass. Cheap, deterministic, clear message.
      - name: Bundle-size guard
        run: npm run size:check

      - name: Run Lighthouse CI
        # EXACT version, not a range: `npx --yes` installs whatever the range
        # resolves to at run time and executes it with the LHCI token in its
        # environment, so a range is a standing permission for any future
        # 0.15.* publish to run here. 0.15.1 is what `0.15.x` resolved to when
        # it was pinned; a bump is a deliberate edit (Dependabot cannot see
        # an npx argument).
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
