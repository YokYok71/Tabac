name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lancé à la main sur une AUTRE branche, ce workflow est une répétition à
  # blanc : tout tourne, rien n'est publié (voir la condition du job `deploy`).
  workflow_dispatch:

# Node 20 is being deprecated on GitHub Actions runners
# (forced to Node 24 on June 2nd, 2026, removed September 16th, 2026).
# `node-version: "24"` in setup-node only controls what `npm test` /
# `npm run build` see — the actions THEMSELVES (checkout, setup-node,
# upload-artifact) still run on whatever Node version they declare
# (currently 20). This env var forces ALL JavaScript actions to use
# Node 24 right now, silencing the deprecation warning on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CodeQL js/actions/missing-workflow-permissions: declare the
# minimum permissions explicitly at the top level (deny everything)
# then opt in per job. Defends against a compromised action that
# would otherwise inherit the default GITHUB_TOKEN's write scope.
permissions: {}

# Serialize Pages deploys. Without `concurrency`, every
# push starts a parallel deploy that GitHub Pages then queues
# (the github-pages environment allows only one concurrent deploy).
# When many commits land in quick succession this creates a backlog
# where each deploy waits ~5-10 min in "Queued" status. With this
# group, an in-progress deploy is cancelled when a newer push starts,
# so only the latest commit ever holds the slot.
concurrency:
  group: pages
  cancel-in-progress: true

# ── CINQ JOBS AU LIEU D'UN, ET LA GARANTIE N'A PAS BOUGÉ ───────────────────────
#
# Tout tenait dans un seul job, étape après étape : installation, tests, build,
# portes, Chromium, contraste, puis la mise en page des six langues — environ
# 11 min 30 d'horloge, dont 5 min 28 pour la seule mise en page. Aucune de ces
# étapes n'attend réellement les autres, sauf les campagnes, qui ont besoin du
# `dist/` construit.
#
#   bundle ── browser (contraste + une langue × une largeur par job) ─┐
#   gates ─── (doc, tsc, lint, knip) ─────────────────────────────────┼─ deploy
#   tests ─── (la suite, en deux moitiés côte à côte) ────────────────┘
#
# `gates` et `tests` partent tout de suite, en parallèle de `bundle` ; les
# campagnes partent dès que le `dist/` existe, sans attendre les tests.
# MESURÉ en un job par langue : 6 min 04 contre ~11 min 30, avec la mise en
# page d'une langue (~4 min 07 de rendu) puis les tests (~4 min avec le reste
# de `gates`) pour chemins critiques — d'où le découpage par largeur et la
# suite en deux. **LA GARANTIE EST LA MÊME
# QU'AVANT** : `deploy` exige le succès de TOUS, et c'est lui seul qui
# téléverse l'artefact Pages — aucun job ne peut publier ce qu'un autre a
# refusé. « Une porte dans un workflow parallèle ne peut pas bloquer un
# déploiement » reste vrai ; une porte dans un job dont `deploy` dépend, si.
#
# LES CAMPAGNES MESURENT LE `dist/` QUI SERA PUBLIÉ, pas une reconstruction :
# `bundle` le téléverse comme artefact du run, les jobs `browser` le
# téléchargent, et `deploy` publie ce même artefact. C'était la raison de la
# mise en série (« un job séparé devrait reconstruire ») ; un artefact de run
# la satisfait sans la série.
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lire l'historique des runs de CE workflow, pour trouver le dernier
      # commit déployé (voir l'étape « Browser scope »). Lecture seule.
      actions: read
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Build (Vite)
        id: build
        run: |
          npm ci
          npm run build

      # The ONE gate that needs the build step to have SUCCEEDED, not merely to
      # have been attempted: without dist/ it reported `dist/ not found`, which
      # was the LAST error in the log and the first thing a reader saw — how a
      # flaky test once got diagnosed as a build problem, back when tests and
      # build shared a step. The `!cancelled()` intent is unchanged.
      - name: Bundle size budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run size:check

      # FAUT-IL MESURER CE COMMIT DANS UN NAVIGATEUR ? Voir scripts/browserScope.cjs.
      #
      # Le filtre par chemins avait été REFUSÉ ici, à raison, tant que sa base
      # était `github.event.before` : `cancel-in-progress` annule les runs
      # intermédiaires, si bien que deux poussées rapprochées (une vue, puis de
      # la documentation) laissaient le run survivant ne voir que la seconde, et
      # la vue partait NON MESURÉE. La base est désormais le DERNIER COMMIT
      # DÉPLOYÉ AVEC SUCCÈS : un run annulé n'a rien publié, donc ses fichiers
      # restent dans le diff du suivant. FAIL-CLOSED : base introuvable, diff
      # impossible, lancement manuel → campagne complète.
      - name: Browser scope
        id: scope
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" || echo "base $BASE introuvable — le script mesurera"
          fi
          BROWSER_SCOPE_BASE="$BASE" node scripts/browserScope.cjs

      # L'artefact du RUN (pas celui de Pages) : les campagnes le mesurent et
      # `deploy` le publie, si bien que ce qui est mesuré est ce qui part.
      - uses: actions/upload-artifact@v7
        if: ${{ steps.build.outcome == 'success' }}
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
          # upload-artifact laisse les fichiers cachés de côté par défaut ;
          # l'étape de publication, qui lisait dist/ directement, les gardait. Un
          # `.well-known/` ajouté un jour disparaîtrait du site sans un mot.
          include-hidden-files: true

  # THE GATES GATE THE DEPLOY.
  #
  # Until they lived in this workflow, `checks.yml` ran typecheck / lint / prune
  # and `lighthouse.yml` ran size:check — both IN PARALLEL with this workflow,
  # neither able to stop it. So a push that failed any of them still uploaded
  # its artifact and shipped to Pages; the red X arrived afterwards, on a build
  # users already had. An earlier pass fixed "these gates run nowhere"; it did
  # not fix "they gate nothing".
  #
  # The reachable case is not hypothetical: Vite/Rolldown transpiles without
  # typechecking, so a `tsc` error builds and deploys perfectly happily.
  # (`catalogue:check` was a fifth gate here until the app stopped shipping a
  # catalogue at all — it now needs a `--csv` argument and is a reviewer tool,
  # not a CI gate.)
  #
  # Their own job now, started at once beside `bundle`: none of them reads
  # dist/ (`serviceWorker.test.ts` forbids a test that does), so waiting for
  # the build bought nothing. The test suite has its own job below, split in
  # two. Each gate step carries `!cancelled()` so one push reports every class
  # at once instead of one per re-run.
  #
  # Yes, this duplicates checks.yml on a push to main. That is deliberate and it
  # is the cheap half of the trade: checks.yml gives fast, isolated feedback
  # (and is the ONLY gate on pull requests), while this copy is the one that can
  # actually hold the artifact back.
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # i18n parity + key-existence + length checks. The bump
      # guard is intentionally skipped in CI (developer discipline +
      # local pre-push handle that). CI's job here is to catch i18n
      # parity bugs and allowlist drift before they reach main.
      #
      # Warnings (⚠) are re-emitted as ::warning:: annotations so they
      # surface in the GH Actions UI timeline without scrolling logs.
      # Errors still fail the step (script exit 1).
      - name: Documentation & i18n check
        if: ${{ !cancelled() }}
        env:
          DOC_CHECK_SKIP_BUMP: "1"
        run: |
          set +e
          npm run doc:check 2>&1 | tee /tmp/doc-check.log
          rc=${PIPESTATUS[0]}
          # Each warning line starts with two spaces then ⚠ (printed in
          # doc-check.cjs). The grep -c is tolerant of zero matches.
          n=$(grep -c '^  ⚠ ' /tmp/doc-check.log || true)
          if [ "$n" -gt 0 ]; then
            echo "::warning title=doc:check::Produced $n warning(s) — see job log"
            # Also emit one ::warning:: per warning so they all appear
            # individually in the timeline / PR Checks tab. The grep
            # captures the rest of the line for context.
            grep '^  ⚠ ' /tmp/doc-check.log | sed 's/^  ⚠ /::warning::/'
          fi
          exit $rc

      - name: TypeScript (strict)
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Dead code (knip)
        if: ${{ !cancelled() }}
        run: npm run prune

  # LA SUITE, EN DEUX MOITIÉS CÔTE À CÔTE. Elle tenait seule ~2 min 30 du job
  # `gates`, devenu le chemin critique une fois la mise en page découpée.
  # `vitest --shard=i/N` répartit les FICHIERS de test ; N est
  # `strategy.job-total`, le nombre de jobs de cette matrice lu par GitHub, et
  # non un second chiffre écrit à la main : la matrice et le découpage ne
  # peuvent pas diverger, donc l'union des moitiés est la suite entière.
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Chaque moitié rapporte même si l'autre a échoué.
      fail-fast: false
      matrix:
        part: [1, 2]
    name: Tests ${{ matrix.part }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Tests
        run: npm test -- --shard=${{ matrix.part }}/${{ strategy.job-total }}

  # ── LES CAMPAGNES NAVIGATEUR SONT DES PORTES DE DÉPLOIEMENT ────────────────
  #
  # Elles vivaient dans leur propre workflow, en parallèle de celui-ci, donc
  # elles ne pouvaient RIEN retenir : l'artefact partait, l'application
  # arrivait sur le téléphone, et le verdict de mise en page et de contraste
  # tombait ~9 min plus tard sur un build que l'utilisateur avait déjà. Fenêtre
  # signalée comme gênante, donc fermée — et elle le reste : `deploy` les attend.
  #
  # UN JOB PAR MORCEAU : le contraste entier, puis UNE LANGUE × UNE LARGEUR par
  # job (les largeurs : `DEFAULT_WIDTHS` du vérificateur). La liste
  # vient de `bundle` (scripts/browserScope.cjs), qui la DÉRIVE du registre des
  # langues — jamais écrite ici : une matrice littérale est la liste figée qui a
  # déjà fait sauter le portugais au vérificateur. L'union des morceaux est la
  # matrice complète ; `deployGates.test.ts` le vérifie.
  browser:
    needs: bundle
    if: ${{ needs.bundle.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Chaque morceau rapporte même si un autre a échoué : un push dit tout.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.bundle.outputs.shards) }}
    name: ${{ matrix.shard.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # `vite preview` sert le dist/ mesuré : il faut node_modules.
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Les deux vérificateurs REFUSENT un dist/ plus vieux que src/
      # (scripts/distFreshness.cjs, une garde écrite pour les humains). Ici le
      # checkout vient d'être fait et l'artefact a été construit par CE run,
      # sur CE commit, dans `bundle` : il est frais par construction, et seule
      # son horodatage dit le contraire si l'extraction conserve celui du zip.
      - name: Mark the downloaded bundle as built from this checkout
        run: find dist -exec touch {} +

      - name: Install playwright-core + Chromium
        # A download that hangs used to hold the deploy for the runner's 6-hour
        # ceiling: build 53 (7 Oct 2026) sat here from 19:59 to 01:55 and was
        # never deployed. It normally takes a minute or two.
        timeout-minutes: 15
        run: |
          npm i --no-save playwright-core
          npx playwright-core install --with-deps chromium

      - name: Contrast — 6 palettes × 36 screens
        if: ${{ matrix.shard.check == 'theme:contrast' }}
        run: npm run theme:contrast

      - name: Layout — one language × one width × 36 screens × 2 text sizes
        if: ${{ matrix.shard.check == 'i18n:layout' }}
        env:
          I18N_LAYOUT_LANGS: ${{ matrix.shard.langs }}
          I18N_LAYOUT_WIDTHS: ${{ matrix.shard.widths }}
        run: npm run i18n:layout

      # Un morceau qu'aucune étape ne reconnaît passerait VERT sans rien avoir
      # mesuré. Il échoue.
      - name: Refuse an unknown shard
        if: ${{ matrix.shard.check != 'theme:contrast' && matrix.shard.check != 'i18n:layout' }}
        run: |
          echo "::error::morceau inconnu : ${{ matrix.shard.check }}"
          exit 1

  # LE SEUL JOB QUI PUBLIE, et il exige tout le reste.
  #
  # `browser` peut être SAUTÉ — légitimement quand `bundle` a jugé que rien ne
  # change un pixel. Ce saut-là seulement est accepté : un `browser` sauté alors
  # que `bundle` demandait la mesure ne publie pas. Sur une autre branche que
  # main (lancement manuel), rien n'est publié : c'est une répétition.
  deploy:
    needs: [bundle, gates, tests, browser]
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.bundle.result == 'success'
      && needs.gates.result == 'success'
      && needs.tests.result == 'success'
      && (needs.browser.result == 'success'
      || (needs.browser.result == 'skipped' && needs.bundle.outputs.browser == 'false')) }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deployment
